<h1>About Petal OS</h1>
<p>Petal OS (はなびらOS) is a small hobby operating system written from the ground up in C and assembly.</p>
<p>It starts with GRUB, draws its own windows, reads the mouse and keyboard itself, and keeps files in memory.</p>
